<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusSwap · Buy, sell and swap with students on your campus</title>
  <meta name="description" content="Textbooks, notes, laptops and more, bought, sold and swapped between students on your campus. No shipping, no fees.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@1.52.0/font/lucide.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/layout/landing.css">
  <link rel="stylesheet" href="assets/css/pages/landing/home.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-bar">
      <a class="header-logo" href="index.html" aria-label="CampusSwap home">
        <span class="header-mark"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 9.3A8 8 0 0 1 19.5 9.3M20.3 6.4L19.5 9.3L17.1 7.5M19.5 14.7A8 8 0 0 1 4.5 14.7M3.7 17.6L4.5 14.7L6.9 16.5"></path><path d="M12 8.4L16 10.4L12 12.4L8 10.4Z" fill="currentColor" stroke-width="1.4"></path><path d="M9.9 11.5v1.9c0 .8 1 1.4 2.1 1.4s2.1-.6 2.1-1.4v-1.9" stroke-width="1.6"></path></svg></span>
        <span class="header-name">Campus<span>Swap</span></span>
      </a>

      <nav class="header-nav" aria-label="Main">
        <ul class="header-links">
          <li><a class="header-link" href="#browse">Browse</a></li>
          <li><a class="header-link" href="#sell">Sell</a></li>
          <li><a class="header-link" href="#swap">Swap</a></li>
          <li><a class="header-link" href="#favorites">Favorites</a></li>
          <li><a class="header-link" href="#how">How it works</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <a class="btn btn-s header-register" href="register.html">Register</a>
        <a class="btn btn-p" href="login.html">Log in</a>
        <button class="icon-btn header-menu-btn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu">
          <i class="icon-menu" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <div class="mobile-menu" id="mobile-menu">
      <div class="mobile-menu-panel" role="dialog" aria-modal="true" aria-label="Menu">
        <div class="mobile-menu-top">
          <a class="header-logo" href="index.html" aria-label="CampusSwap home">
            <span class="header-mark"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 9.3A8 8 0 0 1 19.5 9.3M20.3 6.4L19.5 9.3L17.1 7.5M19.5 14.7A8 8 0 0 1 4.5 14.7M3.7 17.6L4.5 14.7L6.9 16.5"></path><path d="M12 8.4L16 10.4L12 12.4L8 10.4Z" fill="currentColor" stroke-width="1.4"></path><path d="M9.9 11.5v1.9c0 .8 1 1.4 2.1 1.4s2.1-.6 2.1-1.4v-1.9" stroke-width="1.6"></path></svg></span>
            <span class="header-name">Campus<span>Swap</span></span>
          </a>
          <button class="icon-btn mobile-menu-close" type="button" aria-label="Close menu">
            <i class="icon-x" aria-hidden="true"></i>
          </button>
        </div>

        <div class="mobile-menu-body">
          <nav aria-label="Menu links">
            <!-- The rows are added by assets/js/components/header.js -->
            <ul class="mobile-menu-links"></ul>
          </nav>

          <div class="mobile-menu-buttons">
            <a class="btn btn-p" href="login.html">Log in</a>
            <a class="btn btn-s" href="register.html">Register</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main id="top">
    <section id="browse" class="sec browse" aria-labelledby="browse-title">
      <div class="wrap">
        <div class="browse-head reveal">
          <div class="browse-heading">
            <p class="eyebrow">Recently posted</p>
            <h2 id="browse-title">Fresh on campus this week</h2>
          </div>
          <a class="btn btn-s" href="#browse">Start browsing</a>
          <a class="browse-all" href="#browse">See all</a>
        </div>
        <div class="browse-grid"></div>
        <template id="listing-card">
          <article class="card listing reveal">
            <div class="listing-media">
              <img class="listing-photo" alt="" width="800" height="600" loading="lazy">
              <div class="listing-dim"></div>
              <div class="listing-sold">
                <span class="listing-stamp"><span class="listing-stamp-check"><i class="icon-check" aria-hidden="true"></i></span>Sold</span>
                <span class="listing-owner">Found a new owner</span>
              </div>
              <button class="fav" type="button" aria-label="Save to favorites"><i class="icon-heart" aria-hidden="true"></i></button>
            </div>
            <div class="listing-body">
              <div class="listing-meta"><span class="listing-cat"></span><span class="listing-time"></span></div>
              <h3 class="listing-title"><a class="listing-link" href="listing.html"></a></h3>
              <div class="listing-badges">
                <span class="badge-cond"></span>
                <span class="badge-swap"><i class="icon-arrow-left-right" aria-hidden="true"></i><span>Swap<span class="badge-swap-more"> available</span></span></span>
              </div>
              <div class="listing-foot">
                <span class="listing-price"></span>
                <span class="listing-where"></span>
              </div>
            </div>
          </article>
        </template>
        <a class="btn btn-s browse-more" href="#browse">Start browsing</a>
      </div>
    </section>
  </main>

  <script src="assets/js/utils/format.js"></script>
  <script src="assets/js/utils/storage.js"></script>
  <script src="assets/js/data/listings.js"></script>
  <script src="assets/js/components/header.js"></script>
  <script src="assets/js/pages/landing/home.js"></script>
</body>
</html>
